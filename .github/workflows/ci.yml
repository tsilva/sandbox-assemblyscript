name: CI

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  validate:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use pinned package-manager versions
        run: npm install --global --ignore-scripts npm@11.20.0 pnpm@10.27.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build debug and release WebAssembly
        run: pnpm run asbuild
      - name: Verify assertions and test failure propagation
        run: pnpm test
      - name: Audit locked dependencies
        run: pnpm audit
